# config/redis/redis.conf
# =============================================================================
# Redis para memória do agente UE5 — isolado do Redis do LiteLLM
# As configurações críticas (senha, maxmemory) são passadas via command
# no docker-compose.yml. Este arquivo contém configurações complementares.
# =============================================================================

# Persistência — garante que históricos de sessão sobrevivam a restarts
appendonly yes
appendfsync everysec

# Segurança
protected-mode yes
# bind não especificado aqui — deixa o Docker controlar via rede interna

# Performance
tcp-backlog 511
tcp-keepalive 300
hz 10

# Logging
loglevel notice
logfile ""

# Slow log — registra comandos que levam mais de 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# Notificações de keyspace (para futuros listeners de expiração de sessão)
notify-keyspace-events ""