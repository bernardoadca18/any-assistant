networks:
  assistant_internal:
    driver: bridge
    name: assistant_internal

  litellm_public:
    external: true
    name: litellm_public

volumes:
  qdrant-storage:
    labels:
      description: "Qdrant vector database storage for UE5 docs embeddings"
  agent-redis-data:
    labels:
      description: "Redis for agent session memory and conversation history"

services:

  # ---------------------------------------------------------------------------
  # QDRANT — Vector Database (sem healthcheck interno — imagem distroless)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: ue5-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
    volumes:
      - qdrant-storage:/qdrant/storage
      - ./config/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    ports:
      - "6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - assistant_internal
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # QDRANT HEALTHCHECK — container sidecar usando alpine (tem wget nativo)
  # Fica healthy quando o Qdrant responde em /healthz.
  # O ue5-agent depende deste container, não do qdrant diretamente.
  # ---------------------------------------------------------------------------
  qdrant-healthcheck:
    image: alpine:3.19
    container_name: ue5-qdrant-healthcheck
    restart: unless-stopped
    command: ["sh", "-c", "while true; do sleep 30; done"]
    networks:
      - assistant_internal
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://qdrant:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 16M

  # ---------------------------------------------------------------------------
  # REDIS — Agent Session Memory
  # ---------------------------------------------------------------------------
  agent-redis:
    image: redis:7-alpine
    container_name: ue5-agent-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${AGENT_REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --maxclients 100
      --timeout 300
      --save 900 1
      --save 300 10
    volumes:
      - agent-redis-data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    expose:
      - "6379"
    networks:
      - assistant_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AGENT_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # FASTAPI — UE5 AI Agent Service
  # ---------------------------------------------------------------------------
  ue5-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ue5-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: "ue5_docs"
      REDIS_HOST: agent-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${AGENT_REDIS_PASSWORD}
      LITELLM_BASE_URL: "http://litellm-proxy:4000"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ollama-embed}
      EMBEDDING_DIM: "1024"
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      qdrant-healthcheck:
        condition: service_healthy
      agent-redis:
        condition: service_healthy
    networks:
      - assistant_internal
      - litellm_public
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    volumes:
      - /mnt/c/Program Files/Epic Games/UE_5.8/Engine:/data/ue5_engine_root:ro
      - /mnt/c/Users/Bernardo.DESKTOP-G7D68S2/Downloads/Ingest_projects:/data/projects_source:ro
      - /mnt/c/Users/Bernardo.DESKTOP-G7D68S2/Documents/Unreal Projects:/data/sample_projects:ro