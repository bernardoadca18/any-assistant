networks:
  assistant_internal:
    driver: bridge
    internal: true
    name: assistant_internal

  litellm_public:
    external: true
    name: litellm_public

volumes:
  qdrant-storage:
    labels:
      description: "Qdrant vector database storage for UE5 docs embeddings"
  agent-redis-data:
    labels:
      description: "Redis for agent session memory and conversation history"

services:

  # ---------------------------------------------------------------------------
  # QDRANT — Vector Database
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: ue5-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
    volumes:
      - qdrant-storage:/qdrant/storage
      - ./config/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    ports:
      - "6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - assistant_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # REDIS — Agent Session Memory
  # ---------------------------------------------------------------------------
  agent-redis:
    image: redis:7-alpine
    container_name: ue5-agent-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${AGENT_REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --maxclients 100
      --timeout 300
      --save 900 1
      --save 300 10
    volumes:
      - agent-redis-data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    expose:
      - "6379"
    networks:
      - assistant_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AGENT_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # FASTAPI — UE5 AI Agent Service
  # ---------------------------------------------------------------------------
  ue5-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ue5-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: "ue5_docs"
      REDIS_HOST: agent-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${AGENT_REDIS_PASSWORD}
      LITELLM_BASE_URL: "http://litellm-proxy:4000"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      EMBEDDING_MODEL: "mxbai-embed-large"
      EMBEDDING_DIM: "1024"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      qdrant:
        condition: service_healthy
      agent-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - assistant_internal
      - litellm_public
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'