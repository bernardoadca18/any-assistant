networks:
  assistant_internal:
    driver: bridge
    name: assistant_internal

  litellm_public:
    external: true
    name: litellm_public

volumes:
  qdrant-storage:
    name: qdrant-storage
    labels:
      description: "Qdrant vector database storage for UE5 docs embeddings"
  agent-redis-data:
    name: agent-redis-data
    labels:
      description: "Redis for agent session memory and conversation history"
  agent-postgres-data:
    name: agent-postgres-data
    labels:
      description: "Postgres — persistência durável do histórico de chat/mensagens do agente UE5"


services:

  # ---------------------------------------------------------------------------
  # FRONTEND — React + Vite + TypeScript (SPA)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/v1}
        VITE_QDRANT_DASHBOARD_URL: ${VITE_QDRANT_DASHBOARD_URL:-http://localhost:6333/dashboard}
        VITE_LITELLM_PROXY_URL: ${VITE_LITELLM_PROXY_URL:-http://localhost:4000}
    container_name: ue5-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      ue5-agent:
        condition: service_healthy
    networks:
      - assistant_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ---------------------------------------------------------------------------
  # QDRANT — Vector Database (sem healthcheck interno — imagem distroless)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: ue5-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
    volumes:
      - qdrant-storage:/qdrant/storage
      - ./config/qdrant/config.yaml:/qdrant/config/production.yaml:ro
      - ./backups/qdrant-snapshots:/qdrant/snapshots
    ports:
      - "6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - assistant_internal
    # CORREÇÃO: o RocksDB (storage engine do Qdrant nesta versão) abre
    # muitos arquivos simultâneos por segmento (.sst/.log/.dbtmp) — em
    # cargas de escrita em lote (ex: migração de coleção, ingestão grande)
    # isso estoura o limite padrão de file descriptors do container
    # (geralmente 1024 no Docker Desktop/WSL2), travando o processo com
    # "Too many open files (os error 24)" e deixando a collection num
    # estado instável (segmentos que falharam no meio de um flush). Subimos
    # o limite explicitamente — 65536 é uma folga generosa para o volume
    # de segmentos gerado por uma coleção deste tamanho.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # QDRANT HEALTHCHECK — container sidecar usando alpine (tem wget nativo)
  # Fica healthy quando o Qdrant responde em /healthz.
  # O ue5-agent depende deste container, não do qdrant diretamente.
  # ---------------------------------------------------------------------------
  qdrant-healthcheck:
    image: alpine:3.19
    container_name: ue5-qdrant-healthcheck
    restart: unless-stopped
    command: ["sh", "-c", "while true; do sleep 30; done"]
    networks:
      - assistant_internal
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://qdrant:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 16M

  # ---------------------------------------------------------------------------
  # REDIS — Agent Session Memory
  # ---------------------------------------------------------------------------
  agent-redis:
    image: redis:7-alpine
    container_name: ue5-agent-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${AGENT_REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --maxclients 100
      --timeout 300
      --save 900 1
      --save 300 10
    volumes:
      - agent-redis-data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    expose:
      - "6379"
    networks:
      - assistant_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AGENT_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
  # ---------------------------------------------------------------------------
  # POSTGRES — Persistência durável de sessões, mensagens e chunks citados
  # (fonte de verdade do histórico de chat; o Redis acima segue existindo
  # como cache de curto prazo do contexto recente por sessão)
  # ---------------------------------------------------------------------------
  agent-postgres:
    image: postgres:16-alpine
    container_name: ue5-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AGENT_POSTGRES_USER:-ue5rag}
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AGENT_POSTGRES_DB:-ue5_rag_assistant}
      LANG: en_US.utf8
    volumes:
      - agent-postgres-data:/var/lib/postgresql/data
      # Scripts aqui rodam automaticamente (ordem alfabética), só na
      # primeira inicialização do volume — ver 001_init_schema.sql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    networks:
      - assistant_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AGENT_POSTGRES_USER:-ue5rag} -d ${AGENT_POSTGRES_DB:-ue5_rag_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # FASTAPI — UE5 AI Agent Service
  # ---------------------------------------------------------------------------
  ue5-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ue5-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: "godot_4"
      REDIS_HOST: agent-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${AGENT_REDIS_PASSWORD}
      POSTGRES_HOST: agent-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${AGENT_POSTGRES_USER:-ue5rag}
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AGENT_POSTGRES_DB:-ue5_rag_assistant}
      DATABASE_URL: "postgresql+asyncpg://${AGENT_POSTGRES_USER:-ue5rag}:${AGENT_POSTGRES_PASSWORD}@agent-postgres:5432/${AGENT_POSTGRES_DB:-ue5_rag_assistant}"
      LITELLM_BASE_URL: "http://litellm-proxy:4000"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ollama-embed}
      EMBEDDING_DIM: "1024"
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      qdrant-healthcheck:
        condition: service_healthy
      agent-redis:
        condition: service_healthy
      agent-postgres:
        condition: service_healthy
    networks:
      - assistant_internal
      - litellm_public
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    volumes:
      - /mnt/c/Program Files/Epic Games/UE_5.8/Engine:/data/ue5_engine_root:ro
      - /mnt/c/Users/Bernardo.DESKTOP-G7D68S2/Downloads/Ingest_projects:/data/projects_source:ro
      - /mnt/c/Users/Bernardo.DESKTOP-G7D68S2/Documents/Unreal Projects:/data/sample_projects:ro

      - /home/bernardo/godot_sources/godot_engine_4:/data/godot_engine_root:ro
      - /home/bernardo/godot_sources/godot_docs_4:/data/godot_docs_root:ro
      - /home/bernardo/godot_sources/godot_demo_projects:/data/sample_projects:ro